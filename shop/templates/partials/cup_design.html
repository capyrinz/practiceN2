{% load shop_extras %}
<div class="cup-design">
  <div class="cup-lid"></div>
  <div class="cup-body">
    <div class="cup-band">ЗЕРНО</div>
    {% for item in design %}
      <span class="cup-placed" style="left: {{ item.x }}%; top: {{ item.y }}%; font-size: {{ item.scale|mul:24 }}px; transform: translate(-50%, -50%) rotate({{ item.rotation }}deg);">
        {{ item.object.symbol }}
      </span>
    {% empty %}
      {% if not hide_empty %}
        <div class="design-empty">Соберите дизайн<br>в стикер-студии</div>
      {% endif %}
    {% endfor %}
  </div>
</div>
